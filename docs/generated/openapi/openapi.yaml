      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProvidersResponse"
        "429": &a1
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      tags: &a2
        - auth
  /auth/register:
    post:
