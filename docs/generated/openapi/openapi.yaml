      responses:
        "200":
          description: Una fila por serie de marcas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordsOverviewResponse"
        "401": &a7
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security: &a8
        - bearer: []
      tags: &a9
        - records
    post:
      operationId: RecordsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalRecordResponse"
        "400":
          description: VALIDATION_FAILED, RECORD_TYPE_NOT_ALLOWED o INVALID_RECORD_VALUE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401": *a7
        "404":
          description: MOVEMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security: *a8
      tags: *a9
  /records/summary:
    get:
      operationId: RecordsController_summary
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordsSummaryResponse"
        "401": *a7
      security: *a8
      tags: *a9
  /records/{movementSlug}:
    get:
      operationId: RecordsController_forMovement
      parameters:
        - name: movementSlug
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementRecordsResponse"
        "400":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401": *a7
        "404":
          description: MOVEMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security: *a8
      tags: *a9
  /records/{id}:
    patch:
      operationId: RecordsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecordDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalRecordResponse"
        "400":
          description: VALIDATION_FAILED o INVALID_RECORD_VALUE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401": *a7
        "404":
          description: RECORD_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security: *a8
      tags: *a9
    delete:
      operationId: RecordsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: Marca retirada (borrado lógico)
        "401": *a7
        "404":
          description: RECORD_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security: *a8
      tags: *a9
  /wods:
    get:
      operationId: WodsController_list
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: &a10
        - bearer: []
      tags: &a11
        - wods
    post:
      operationId: WodsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWodDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: *a10
      tags: *a11
  /wods/{slug}:
    get:
      operationId: WodsController_get
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: *a10
      tags: *a11
  /workouts:
    get:
      operationId: WorkoutsController_list
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: &a12
        - bearer: []
      tags: &a13
        - workouts
    post:
      operationId: WorkoutsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkoutDto"
      responses:
        "201":
          description: ""
      security: *a12
      tags: *a13
  /workouts/stats:
    get:
      operationId: WorkoutsController_stats
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
      security: *a12
      tags: *a13
  /workouts/{id}:
    get:
      operationId: WorkoutsController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      security: *a12
      tags: *a13
    patch:
      operationId: WorkoutsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkoutDto"
      responses:
        "200":
          description: ""
      security: *a12
      tags: *a13
    delete:
      operationId: WorkoutsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: ""
      security: *a12
      tags: *a13
  /workouts/{id}/start:
    post:
      operationId: WorkoutsController_start
      parameters:
        - name: id
          required: true
          in: path
