      tags: *a14
info:
  title: GarFit API
  description: "API central de GarFit: autenticación, perfil del atleta y releases."
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        database:
          type: string
          enum:
            - up
            - down
        version:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - database
        - version
        - timestamp
    ApiErrorResponse:
      type: object
      properties:
        statusCode:
          type: number
          example: 404
        code:
          type: string
          example: NO_RELEASE_PUBLISHED
        message:
          type: string
        details:
          type: array
          items:
            type: string
      required:
        - statusCode
        - code
        - message
    GoogleProviderResponse:
      type: object
      properties:
        enabled:
          type: boolean
        webClientId:
          type: string
          nullable: true
      required:
        - enabled
        - webClientId
    AuthProvidersResponse:
      type: object
      properties:
        local:
          type: boolean
          enum:
            - true
        google:
          $ref: "#/components/schemas/GoogleProviderResponse"
      required:
        - local
        - google
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: atleta@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          maxLength: 80
          example: Ana López
      required:
        - email
        - password
        - name
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        providers:
          type: array
          items:
            type: string
            enum:
              - LOCAL
              - GOOGLE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - avatarUrl
        - providers
        - createdAt
        - updatedAt
    AuthTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT HS256 de vida corta.
        accessTokenExpiresIn:
          type: number
          description: Segundos hasta que expira el access token.
        refreshToken:
          type: string
          description: Token opaco y rotativo.
        refreshTokenExpiresAt:
          type: string
          format: date-time
      required:
        - accessToken
        - accessTokenExpiresIn
        - refreshToken
        - refreshTokenExpiresAt
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
        tokens:
          $ref: "#/components/schemas/AuthTokensResponse"
      required:
        - user
        - tokens
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: atleta@example.com
        password:
          type: string
      required:
        - email
        - password
    GoogleLoginDto:
      type: object
      properties:
        idToken:
          type: string
          description: ID token (JWT) emitido por Google Identity Services.
      required:
        - idToken
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token opaco emitido por GarFit.
      required:
        - refreshToken
    ExperienceLevel:
      type: string
      enum:
        - BEGINNER
        - INTERMEDIATE
        - ADVANCED
    PrimaryGoal:
      type: string
      enum:
        - STRENGTH
        - ENDURANCE
        - HYPERTROPHY
        - WEIGHT_LOSS
        - GENERAL_FITNESS
    UnitSystem:
      type: string
      enum:
        - METRIC
        - IMPERIAL
    AthleteProfileResponse:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        displayName:
          type: string
        experienceLevel:
          allOf:
            - $ref: "#/components/schemas/ExperienceLevel"
        primaryGoal:
          allOf:
            - $ref: "#/components/schemas/PrimaryGoal"
        preferredUnits:
          allOf:
            - $ref: "#/components/schemas/UnitSystem"
        birthDate:
          type: string
          nullable: true
          format: date
        heightCm:
          type: number
          nullable: true
        weightKg:
          type: number
          nullable: true
          description: kg
        trainingSince:
          type: string
          nullable: true
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - displayName
        - experienceLevel
        - primaryGoal
        - preferredUnits
        - birthDate
        - heightCm
        - weightKg
        - trainingSince
        - createdAt
        - updatedAt
    UpsertAthleteProfileDto:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 40
          example: Ana
        experienceLevel:
          allOf:
            - $ref: "#/components/schemas/ExperienceLevel"
        primaryGoal:
          allOf:
            - $ref: "#/components/schemas/PrimaryGoal"
        preferredUnits:
          default: METRIC
          allOf:
            - $ref: "#/components/schemas/UnitSystem"
        birthDate:
          type: string
          nullable: true
          format: date
          example: 1998-04-21
        heightCm:
          type: number
          nullable: true
          minimum: 50
          maximum: 272
        weightKg:
          type: number
          nullable: true
          minimum: 20
          maximum: 400
          description: Siempre en kg
        trainingSince:
          type: string
          nullable: true
          format: date
      required:
        - displayName
        - experienceLevel
        - primaryGoal
    MovementCategory:
      type: string
      enum:
        - WAIST
        - UPPER_LEGS
        - LOWER_LEGS
        - BACK
        - CHEST
        - SHOULDERS
        - UPPER_ARMS
        - LOWER_ARMS
        - NECK
        - CARDIO
    Equipment:
      type: string
      enum:
        - BODY_WEIGHT
        - ASSISTED
        - WEIGHTED
        - BARBELL
        - OLYMPIC_BARBELL
        - EZ_BARBELL
        - TRAP_BAR
        - SMITH_MACHINE
        - DUMBBELL
        - KETTLEBELL
        - CABLE
        - LEVERAGE_MACHINE
        - SLED_MACHINE
        - BAND
        - RESISTANCE_BAND
        - MEDICINE_BALL
        - STABILITY_BALL
        - BOSU_BALL
        - ROPE
        - ROLLER
        - WHEEL_ROLLER
        - HAMMER
        - TIRE
        - STATIONARY_BIKE
        - ELLIPTICAL_MACHINE
        - STEPMILL_MACHINE
        - SKIERG_MACHINE
        - UPPER_BODY_ERGOMETER
        - ROWING_MACHINE
    MuscleGroup:
      type: string
      enum:
        - ABS
        - OBLIQUES
        - CORE
        - HIP_FLEXORS
        - LOWER_BACK
        - UPPER_BACK
        - LATS
        - TRAPS
        - NECK
        - CHEST
        - SHOULDERS
        - SERRATUS_ANTERIOR
        - BICEPS
        - TRICEPS
        - FOREARMS
        - GLUTES
        - QUADRICEPS
        - HAMSTRINGS
        - ADDUCTORS
        - ABDUCTORS
        - CALVES
        - ANKLES_AND_FEET
        - CARDIOVASCULAR_SYSTEM
    MovementDifficulty:
      type: string
      enum:
        - BEGINNER
        - INTERMEDIATE
        - ADVANCED
    RecordType:
      type: string
      enum:
        - WEIGHT
        - REPS
        - DISTANCE
        - DURATION
        - TIME
    MovementSummaryResponse:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
          example: barbell-full-squat
        name:
          type: string
          example: Barbell full squat
