        "400":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401": *a3
      security: *a4
      tags: *a5
  /movements:
    get:
      operationId: MovementsController_list
      parameters:
        - name: search
          required: false
          in: query
          description: Texto contenido en el nombre
          schema:
