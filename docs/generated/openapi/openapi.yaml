              $ref: "#/components/schemas/ResultsDto"
      responses:
        "200":
          description: ""
      security: *a12
      tags: *a13
  /workouts/{id}/complete:
    post:
      operationId: WorkoutsController_complete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
