        "401":
          description: INVALID_REFRESH_TOKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429": *a1
      tags: *a2
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        "204":
          description: Sesión revocada (idempotente)
        "429": *a1
