packages:
  - apps/*
  - packages/*

# pnpm 11 no ejecuta scripts de instalación salvo los listados aquí.
allowBuilds:
  '@google/genai': false # preinstall no-op
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': false # telemetría
  esbuild: true
  prisma: true
  protobufjs: false # dependencia de @google/genai; no requiere compilación
  puppeteer: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@nestjs/throttler@6.6.0'
  - astro@7.3.3
  - google-auth-library@11.1.0
  - prettier@3.9.7
