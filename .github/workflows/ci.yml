name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://garfit:garfit@localhost:5442/garfit
      TEST_DATABASE_URL: postgresql://garfit:garfit@localhost:5442/garfit_test
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-thirty-two-characters
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: garfit
          POSTGRES_PASSWORD: garfit
          POSTGRES_DB: garfit
        ports: ['5442:5432']
        options: >-
          --health-cmd "pg_isready -U garfit" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @garfit/api prisma:generate
      - run: psql postgresql://garfit:garfit@localhost:5442/garfit -c 'CREATE DATABASE garfit_test;'
      - name: Verificar
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm docs:check
