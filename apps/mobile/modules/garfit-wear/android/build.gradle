plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.garfitwear'
version = '0.1.0'

android {
  namespace "expo.modules.garfitwear"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}
